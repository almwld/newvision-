name: eye_control
description: Production-grade on-device eye control for Android
version: 1.0.0+1
publish_to: 'none'
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  get_it: ^7.7.0
  injectable: ^2.4.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  dartz: ^0.10.1
  vector_math: ^2.1.4
  collection: ^1.18.0
  logger: ^2.4.0
  go_router: ^14.6.2
  fl_chart: ^0.68.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.11
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/face_landmarker.task
    - assets/models/
    - assets/config/
    - assets/translations/
