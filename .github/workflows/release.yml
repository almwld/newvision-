name: 🚀 Release Android
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Flutter SDK path
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.4'
      - name: Fetch and verify MediaPipe model
        run: bash scripts/fetch_face_landmarker.sh
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"
          test -s "$RUNNER_TEMP/signing/release.keystore"
      - name: Build signed release APKs and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -f "$ANDROID_KEYSTORE_PATH" || { echo "Missing decoded release keystore"; exit 1; }
          gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify signed APKs (v1 + v2)
        working-directory: android
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          find app/build/outputs/apk -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            "$APKSIGNER" verify --verbose "$apk" | tee /tmp/apksigner.txt
            grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/apksigner.txt
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          done
      - name: Verify release outputs
        working-directory: android
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          find app/build/outputs/bundle -type f -name '*.aab' -print
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v5
        with:
          name: eye-control-arm64-v8a-${{ github.ref_name }}
          path: android/app/build/outputs/apk/**/app-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v5
        with:
          name: eye-control-armeabi-v7a-${{ github.ref_name }}
          path: android/app/build/outputs/apk/**/app-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v5
        with:
          name: eye-control-x86_64-${{ github.ref_name }}
          path: android/app/build/outputs/apk/**/app-x86_64-release*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: eye-control-aab-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             android/app/build/outputs/apk/release/app-arm64-v8a-release.apk             android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk             android/app/build/outputs/apk/release/app-x86_64-release.apk             android/app/build/outputs/bundle/release/app-release.aab             --title "NewVision $GITHUB_REF_NAME" --generate-notes
