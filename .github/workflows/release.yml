name: 🚀 Release Android
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: stable }
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Flutter SDK path
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Fetch and verify MediaPipe model
        run: bash scripts/fetch_face_landmarker.sh
      - name: Validate signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are required."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/eye-control"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/eye-control/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/eye-control/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --no-shrink
      - name: Build release AAB
        run: flutter build appbundle --release --no-shrink
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: eye-control-arm64-v8a-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: eye-control-armeabi-v7a-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: eye-control-x86_64-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: eye-control-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            --title "NewVision $GITHUB_REF_NAME" --generate-notes
