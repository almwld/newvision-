name: CI

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  flutter:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and verify MediaPipe model
        run: bash scripts/fetch_face_landmarker.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - name: Verify Flutter SDK
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Flutter tests with coverage
        run: flutter test --coverage --no-pub
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Coverage summary
        run: lcov --summary coverage/lcov.info
      - name: Upload Flutter coverage
        uses: actions/upload-artifact@v5
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Configure Flutter SDK path
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Fetch and verify MediaPipe model
        run: bash scripts/fetch_face_landmarker.sh
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.4'
      - name: Android unit tests
        working-directory: android
        run: gradle --no-daemon test
      - name: Android debug build
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify debug APK signing
        working-directory: android
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: eye-control-debug-apk
          path: android/app/build/outputs/apk/**/app-*-debug*.apk
          if-no-files-found: error
          retention-days: 30

  release-apks:
    name: Build split release APKs
    needs: flutter
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Flutter SDK path
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.4'
      - name: Fetch and verify MediaPipe model
        run: bash scripts/fetch_face_landmarker.sh
      - name: Build split release APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release APK outputs and model packaging
        working-directory: android
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -print
          APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -f "$APK"
          echo "arm64 APK size: $(stat -c%s "$APK") bytes"
          unzip -l "$APK" | grep -E 'gaze_fp16\.tflite|face_landmarker\.task'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v5
        with:
          name: app-arm64-v8a-release
          path: android/app/build/outputs/apk/**/app-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v5
        with:
          name: app-armeabi-v7a-release
          path: android/app/build/outputs/apk/**/app-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload x86_64
        uses: actions/upload-artifact@v5
        with:
          name: app-x86_64-release
          path: android/app/build/outputs/apk/**/app-x86_64-release*.apk
          if-no-files-found: error
          retention-days: 30
